# Local dev server config for `trmnlp serve`. Not uploaded to TRMNL.
# The plugin polls the URL in src/settings.yml. To preview against a local server,
# run it with `npm start` in server/ and expose it (e.g. a tunnel), or point
# polling_url at your deployed app.
---
watch:
  - src

time_zone: America/New_York

custom_fields:
  release_scope: all_tracked_releases
  ticker_group: market_leaders
  my_tickers: 'UBER, SHOP'
  display_zone: eastern

# Font sizes are fixed px on purpose: 12 / 16 / 21 px are the device's pixel-font sizes, so text
# stays crisp on the 800x480 1-bit screen. Trade-off: it doesn't scale up on larger TRMNL screens.
ignored_lint_rules:
  - no_style_restyling_framework
