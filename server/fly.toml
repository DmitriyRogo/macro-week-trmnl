# Fly.io config. App names are global: change `app` if "macro-week" is taken,
# then update polling_url in src/settings.yml to match.
# Secrets (never put keys here):
#   fly secrets set FRED_API_KEY=... FINNHUB_API_KEY=...
app = "macro-week"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  REFRESH_MINUTES = "60"

[http_service]
  internal_port = 8080
  force_https = true
  # The cache lives in memory, so keep one machine running instead of
  # cold-starting (and re-fetching upstream) on every TRMNL poll.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "60s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
