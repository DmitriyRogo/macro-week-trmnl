#
# Changes to this file will be overwritten by `trmnlp pull`.
#
# Docs: https://help.trmnl.com/en/articles/10542599-importing-and-exporting-private-plugins#h_581fb988f0
#
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
# Plugin ID on trmnl.com, written by the first `trmnlp push`.
id: 524760
# One URL: the Macro Week server (server/) returns the whole week pre-built.
# Replace the host with your deployed app's URL.
polling_url: https://macro-week.fly.dev/week?scope={{ release_scope }}&group={{ ticker_group }}
# If the server sets ACCESS_TOKEN, send it here: Authorization=Bearer <token>
polling_headers: ''
name: Macro Week
description: US macro + earnings this week
# The server re-checks every 5 minutes on release mornings; poll often enough to show it.
refresh_interval: 15
recipe_overview: |-
  Macro Week puts the US events that move markets this week on your TRMNL, and shows how each one turned out. Headline economic releases such as CPI, the jobs report, GDP, PCE, PPI and retail sales appear with their Eastern release times; once published, the screen shows the actual number with an arrow against the prior reading, plus core inflation or the unemployment rate underneath. FOMC decision days show cut, hold or hike and the new rate range, with projection meetings and minutes marked. Treasury note and bond auctions show the winning yield and demand. Earnings for the biggest US companies show the EPS estimate before the report, then actual EPS and revenue with beat or miss. Market holidays and early closes are marked. Pick a company group and how many releases you want. No setup or API keys needed. Data from FRED (St. Louis Fed), Finnhub, TreasuryDirect and the Federal Reserve. Open source: github.com/DmitriyRogo/macro-week-trmnl
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: finance
  description: Shows what is coming that might move markets this week, and how it turned out. All times are US Eastern (ET). Data from FRED (St. Louis Fed), Finnhub, TreasuryDirect and the Federal Reserve.
  github_url: https://github.com/DmitriyRogo/macro-week-trmnl
  learn_more_url: https://github.com/DmitriyRogo/macro-week-trmnl#readme
- keyname: release_scope
  field_type: select
  name: Releases
  description: '"Headline only" shows CPI, PPI, jobs, GDP, PCE and retail sales. "All tracked" adds JOLTS, jobless claims, consumer sentiment, housing starts, ISM, FOMC minutes and Treasury auctions. FOMC days always show.'
  options:
  - All tracked releases
  - Headline only
  default: all_tracked_releases
- keyname: ticker_group
  field_type: select
  name: Companies
  description: Whose earnings to show. Up to 4 per day, biggest first.
  options:
  - Market leaders
  - Mega cap tech
  - Big banks
  - Dow 30
  default: market_leaders
